apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: khsbatches.hemasundharkolla.com
spec:
  group: hemasundharkolla.com
  names:
    plural: khsbatches
    singular: khsbatch
    kind: KhsBatch
    shortNames: 
      - khs
      - vts
      - ca

  scope: Namespaced
  versions: 
    - name: v1
      served: true
      storage: true
      schema: 
        openAPIV3Schema: 
          type: object
          properties:
            spec:
              type: object
              properties: 
                name: 
                  type: string
                  description: "this is the name of the batch"
                duration: 
                  type: string
                  description: "this the duration of the batch" 



